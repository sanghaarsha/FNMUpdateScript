name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Lint & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest ]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck bats

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install bash coreutils shellcheck bats-core
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix coreutils)/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Verify tool versions
        run: |
          echo "Using bash: $(which bash) ($(/usr/bin/env bash --version | head -n1))"
          shellcheck --version
          bats --version

      - name: Run ShellCheck static analysis
        run: |
          shellcheck fnm_update.sh bin/*.sh test/helpers/*.bash

      - name: Run Bats test suite
        run: |
          bats test/updater.bats
